<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة التطابق الفائقة - تيك توك</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 60%, #030712 100%);
            background-size: 200% 200%;
            animation: auraBackground 12s ease infinite alternate;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        @keyframes auraBackground {
            0% { background-position: 0% 0%; }
            100% { background-position: 100% 100%; }
        }

        /* خلفية الفيديوهات الـ 14 بسلاسة تامة وبدون تعليق */
        .bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            opacity: 0;
            transition: opacity 3s ease-in-out;
            will-change: opacity;
        }

        .bg-video.active {
            opacity: 1; 
        }

        .bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(15, 23, 42, 0.2) 0%, rgba(3, 7, 18, 0.65) 100%);
            z-index: 1;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            position: relative;
            z-index: 2;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            width: 100%;
            max-width: 360px;
            position: relative;
            z-index: 3;
            perspective: 1200px;
            transform-style: preserve-3d;
        }
        
        .grid.celebrate-shake {
            animation: ultraShake 0.6s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
        }

        @keyframes ultraShake {
            10%, 90% { transform: translate3d(-2px, 0, 0) rotate(1deg); }
            20%, 80% { transform: translate3d(4px, 0, 0) rotate(-2deg); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0) rotate(3deg); }
            40%, 60% { transform: translate3d(6px, 0, 0) rotate(-3deg); }
        }
        
        .card-container {
            aspect-ratio: 1;
            perspective: 1000px;
            cursor: pointer;
            z-index: 4;
            will-change: transform, opacity;
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.6s ease;
        }

        .card-container.idle-float {
            animation: floatingBreath 4s ease-in-out infinite alternate;
        }

        @keyframes floatingBreath {
            0% { transform: translate3d(0, 0px, 0) rotate(0deg); }
            100% { transform: translate3d(0, -6px, 12px) rotate(1.5deg); }
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            border-radius: 18px;
        }

        .card-container.flipped .card {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 18px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.4);
            user-select: none;
            overflow: hidden;
        }

        .card-front {
            background: linear-gradient(135deg, rgba(37, 244, 238, 0.9), rgba(254, 44, 85, 0.9));
            backdrop-filter: blur(8px);
            color: #fff;
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            transition: background 1.2s ease, border-radius 0.8s ease, filter 0.5s ease;
        }

        .card-front::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.25), transparent);
            transform: rotate(45deg);
            animation: sweepGlint 3s infinite;
        }

        @keyframes sweepGlint {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }

        .front-content {
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            opacity: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        .card-back {
            background: #ffffff;
            color: #000;
            font-size: 2.8rem;
            transform: rotateY(180deg);
        }

        .tiktok-logo {
            font-size: 1.5rem;
            font-weight: 900;
            text-shadow: 3px 3px 0px #00f2fe, -3px -3px 0px #fe2c55;
            letter-spacing: 1.5px;
        }

        .card-container.matched .card-back {
            animation: matchPulseGlow 1.2s ease infinite alternate;
        }

        @keyframes matchPulseGlow {
            0% { box-shadow: 0 0 15px #25f4ee, inset 0 0 15px #25f4ee; background: #e0f7fa; }
            100% { box-shadow: 0 0 35px #fe2c55, inset 0 0 25px #fe2c55; background: #ffebee; }
        }

        .firework {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            box-shadow: 0 0 25px #fe2c55, 0 0 50px #25f4ee, 0 0 75px #f7ff00;
            animation: explode 1.2s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
            z-index: 10;
            pointer-events: none;
        }

        @keyframes explode {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(50); opacity: 0; }
        }

        .controls {
            margin-top: 25px;
            z-index: 5;
        }
        button {
            background: linear-gradient(135deg, #fe2c55, #ff0050);
            color: white;
            border: none;
            padding: 12px 32px;
            font-size: 1.1rem;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 6px 20px rgba(254, 44, 85, 0.5);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        button:hover {
            transform: scale(1.08);
            box-shadow: 0 8px 25px rgba(254, 44, 85, 0.7);
        }
        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

<div id="videoContainer"></div>
<div class="bg-overlay"></div>

<div class="container">
    <div class="grid" id="gameGrid"></div>
    <div class="controls">
        <button onclick="resetGame()">إعادة اللعبة</button>
    </div>
</div>

<script>
    let names = ["زيد", "عمر", "علي", "سعد", "بكر", "فهد", "خالد", "صقر", "رعد", "برق", "نمر", "ليث"];
    const icons = ["🔥", "⭐", "🏆", "💎", "👑", "🚀"];
    
    const videoFiles = [
        "960.mp4", "972 (1).mp4", "972 (2).mp4", "972 (3).mp4", "972 (4).mp4", 
        "972 (5).mp4", "972 (6).mp4", "972 (7).mp4", "972 (8).mp4", "972 (9).mp4", 
        "972 (10).mp4", "972 (11).mp4", "972 (12).mp4", "973.mp4"
    ];
    
    let currentVideoIndex = -1;
    let videoElements = [];

    const colorGradients = [
        "linear-gradient(135deg, #25f4ee, #fe2c55)",
        "linear-gradient(135deg, #ff0050, #00f2fe)",
        "linear-gradient(135deg, #7928ca, #ff0080)",
        "linear-gradient(135deg, #ffb199, #ff0844)",
        "linear-gradient(135deg, #00c6ff, #0072ff)",
        "linear-gradient(135deg, #f7ff00, #db36a4)",
        "linear-gradient(135deg, #00ff87, #60efff)"
    ];

    let flippedCards = [];
    let lockBoard = false;
    let mainInterval = null;
    let animStep = 0;

    // نظام تشغيل الفيديوهات الـ 14 بضمان عدم التعليق نهائياً مع فاصل 30 ثانية
    function initBackgroundVideos() {
        const container = document.getElementById('videoContainer');
        container.innerHTML = '';
        videoElements = [];

        videoFiles.forEach((file) => {
            const video = document.createElement('video');
            video.src = file;
            video.className = 'bg-video';
            video.autoplay = true;
            video.loop = true;
            video.muted = true;
            video.playsInline = true;
            video.playbackRate = 0.5;
            container.appendChild(video);
            videoElements.push(video);
        });

        setTimeout(playNextVideoSequence, 2000);
    }

    function playNextVideoSequence() {
        if (videoElements.length === 0) return;
        if (currentVideoIndex >= 0) {
            videoElements[currentVideoIndex].classList.remove('active');
            videoElements[currentVideoIndex].pause(); // إيقاف مؤقت لتوفير موارد الجوال وعدم تعليقه
        }
        
        currentVideoIndex = (currentVideoIndex + 1) % videoElements.length;
        
        setTimeout(() => {
            videoElements[currentVideoIndex].play().catch(() => {});
            videoElements[currentVideoIndex].classList.add('active');
            
            setTimeout(() => {
                videoElements[currentVideoIndex].classList.remove('active');
                videoElements[currentVideoIndex].pause();
                setTimeout(playNextVideoSequence, 30000); // 30 ثانية فاصل بالخلفية العادية المتموجة
            }, 15000); // عرض الفيديو لمدة 15 ثانية
        }, 1000);
    }

    function initGame() {
        if (mainInterval) clearInterval(mainInterval);

        let cardItems = [...icons, ...icons];
        cardItems.sort(() => Math.random() - 0.5);

        const grid = document.getElementById('gameGrid');
        grid.innerHTML = '';
        flippedCards = [];
        lockBoard = false;

        cardItems.forEach((icon, index) => {
            const cardContainer = document.createElement('div');
            cardContainer.classList.add('card-container', 'idle-float');
            cardContainer.style.animationDelay = `${(index % 3) * 0.4}s`;

            const card = document.createElement('div');
            card.classList.add('card');

            const frontFace = document.createElement('div');
            frontFace.classList.add('card-face', 'card-front');
            
            const frontContent = document.createElement('div');
            frontContent.classList.add('front-content');
            frontContent.innerText = names[index];
            frontContent.dataset.name = names[index];

            frontFace.appendChild(frontContent);

            const backFace = document.createElement('div');
            backFace.classList.add('card-face', 'card-back');
            backFace.innerText = icon;

            card.appendChild(frontFace);
            card.appendChild(backFace);
            cardContainer.appendChild(card);

            cardContainer.addEventListener('click', () => flipCard(cardContainer, icon));
            grid.appendChild(cardContainer);
        });

        startDynamicLoop();
    }

    // محرك الحركات الكاملة (تراكمي: حركة المربعات الخارجية والداخلية وشعار تيك توك تعمل معاً)
    function startDynamicLoop() {
        mainInterval = setInterval(() => {
            if (lockBoard) return;

            const fronts = document.querySelectorAll('.card-front');
            const contents = document.querySelectorAll('.front-content');
            const cards = document.querySelectorAll('.card-container');

            const unifiedColor = colorGradients[Math.floor(Math.random() * colorGradients.length)];
            fronts.forEach(front => {
                if (!front.closest('.card-container').classList.contains('flipped') && !front.closest('.card-container').classList.contains('matched')) {
                    front.style.background = unifiedColor;
                }
            });

            animStep = (animStep + 1) % 8;

            switch(animStep) {
                case 0:
                    // 1. تساقط الكرات المرن والحر تماماً خارج الشبكة
                    cards.forEach((card, idx) => {
                        card.style.transition = `transform 1.2s cubic-bezier(0.5, 0, 0.75, 1)`;
                        let randX = (Math.random() - 0.5) * 220;
                        card.style.transform = `translate3d(${randX}px, 550px, 0) rotate(${idx * 90}deg) scale(0.5)`;
                        card.querySelector('.card-front').style.borderRadius = "50%";
                    });
                    setTimeout(() => {
                        cards.forEach((card, idx) => {
                            card.style.transition = "none";
                            let randX2 = (Math.random() - 0.5) * 220;
                            card.style.transform = `translate3d(${randX2}px, -550px, 0) scale(0.5)`;
                        });
                        setTimeout(() => {
                            cards.forEach(card => {
                                card.style.transition = `transform 1.2s cubic-bezier(0.34, 1.56, 0.64, 1)`;
                                card.style.transform = `translate3d(0, 0, 0) scale(1)`;
                                card.querySelector('.card-front').style.borderRadius = "18px";
                            });
                        }, 60);
                    }, 1400);
                    break;

                case 1:
                    // 2. حركة الذوبان والانصهار السائل وتدفقها لأسفل الشاشة
                    cards.forEach((card) => {
                        card.style.transition = `transform 1.4s ease, opacity 1s ease`;
                        card.style.transform = `translate3d(0, 480px, 0) scaleY(2.5) scaleX(0.35)`;
                        card.style.opacity = '0.1';
                    });
                    setTimeout(() => {
                        cards.forEach((card) => {
                            card.style.transition = "none";
                            card.style.transform = `translate3d(0, -480px, 0) scaleY(2.5) scaleX(0.35)`;
                        });
                        setTimeout(() => {
                            cards.forEach(card => {
                                card.style.transition = `transform 1.2s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.8s ease`;
                                card.style.transform = `translate3d(0, 0, 0) scale(1)`;
                                card.style.opacity = '1';
                            });
                        }, 50);
                    }, 1500);
                    break;

                case 2:
                    // 3. التبديل الحر الكامل والواسع لأماكن الأسماء (Swap)
                    let swaps = 0;
                    let swapTimer = setInterval(() => {
                        let i = Math.floor(Math.random() * names.length);
                        let j = Math.floor(Math.random() * names.length);
                        let temp = names[i];
                        names[i] = names[j];
                        names[j] = temp;

                        contents.forEach((c, idx) => {
                            if (!c.closest('.card-container').classList.contains('flipped') && !c.closest('.card-container').classList.contains('matched')) {
                                c.innerText = names[idx];
                                c.dataset.name = names[idx];
                            }
                        });
                        swaps++;
                        if(swaps > 8) clearInterval(swapTimer);
                    }, 800);
                    break;

                case 3:
                    // 4. موجة المدرجات الانسيابية الكبرى (Stadium Wave)
                    let waveStart = performance.now();
                    function animateWave(now) {
                        let elapsed = (now - waveStart) / 1000;
                        cards.forEach((card, idx) => {
                            let row = Math.floor(idx / 3);
                            let col = idx % 3;
                            let waveOffset = Math.sin(elapsed * 6 - (row + col) * 0.7) * 40;
                            card.style.transition = "transform 0.1s linear";
                            card.style.transform = `translate3d(${ (col-1)*15 }px, ${waveOffset}px, ${Math.abs(waveOffset)}px) scale(${1 + waveOffset * 0.003})`;
                        });
                        if (elapsed < 4.5) {
                            requestAnimationFrame(animateWave);
                        } else {
                            resetGridTransforms();
                        }
                    }
                    requestAnimationFrame(animateWave);
                    break;

                case 4:
                    // 5. الانفجار المجري وتوسع المربعات لأطراف الشاشة بحرية
                    cards.forEach((card, idx) => {
                        let x = (idx % 3 - 1) * 120;
                        let y = (Math.floor(idx / 3) - 1.5) * 120;
                        card.style.transition = "transform 1s cubic-bezier(0.34, 1.56, 0.64, 1)";
                        card.style.transform = `translate3d(${x}px, ${y}px, 60px) rotate(${ (idx%2===0?1:-1)*45 }deg) scale(0.85)`;
                    });
                    setTimeout(() => {
                        resetGridTransforms();
                    }, 2800);
                    break;

                case 5:
                    // 6. مسح الليزر وإعادة الكتابة الحية للأسماء
                    contents.forEach(c => {
                        if(!c.closest('.card-container').classList.contains('flipped') && !c.closest('.card-container').classList.contains('matched')) {
                            let str = c.dataset.name;
                            c.style.filter = "blur(8px)";
                            c.style.opacity = "0";
                            setTimeout(() => {
                                c.innerText = "";
                                c.style.filter = "none";
                                c.style.opacity = "1";
                                let i = 0;
                                let typeWriter = setInterval(() => {
                                    c.innerText += str.charAt(i);
                                    i++;
                                    if (i >= str.length) clearInterval(typeWriter);
                                }, 100);
                            }, 500);
                        }
                    });
                    break;

                case 6:
                    // 7. ظهور شعار تيك توك بانسيابية تامة
                    contents.forEach(c => {
                        if (!c.closest('.card-container').classList.contains('flipped') && !c.closest('.card-container').classList.contains('matched')) {
                            c.style.transform = "scale(0) rotate(-180deg)";
                            setTimeout(() => {
                                c.innerHTML = `🎵<span class="tiktok-logo">TikTok</span>`;
                                c.style.transform = "scale(1) rotate(0deg)";
                            }, 300);
                        }
                    });
                    setTimeout(() => {
                        contents.forEach(c => {
                            if (!c.closest('.card-container').classList.contains('flipped') && !c.closest('.card-container').classList.contains('matched')) {
                                c.style.transform = "scale(0) rotate(180deg)";
                                setTimeout(() => {
                                    c.innerText = c.dataset.name;
                                    c.style.transform = "scale(1) rotate(0deg)";
                                }, 300);
                            }
                        });
                    }, 2500);
                    break;

                case 7:
                    // 8. حركة انزلاق الصفوف لليسار واليمين
                    cards.forEach((card, idx) => {
                        let row = Math.floor(idx / 3);
                        setTimeout(() => {
                            card.style.transition = "transform 0.5s ease";
                            card.style.transform = "translateX(-150px)";
                            setTimeout(() => {
                                card.style.transform = "translateX(150px)";
                                setTimeout(() => {
                                    resetGridTransforms();
                                }, 400);
                            }, 500);
                        }, row * 180);
                    });
                    break;
            }

        }, 7000);
    }

    function resetGridTransforms() {
        const cards = document.querySelectorAll('.card-container');
        cards.forEach(card => {
            card.style.transition = "transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1)";
            card.style.transform = 'translate3d(0, 0, 0) scale(1) rotate(0deg)';
        });
    }

    function triggerMassiveCelebration() {
        const grid = document.getElementById('gameGrid');
        grid.classList.add('celebrate-shake');
        setTimeout(() => grid.classList.remove('celebrate-shake'), 600);

        for (let i = 0; i < 18; i++) {
            setTimeout(() => {
                const fw = document.createElement('div');
                fw.classList.add('firework');
                fw.style.left = Math.random() * window.innerWidth + 'px';
                fw.style.top = Math.random() * window.innerHeight + 'px';
                document.body.appendChild(fw);
                setTimeout(() => fw.remove(), 1200);
            }, i * 70);
        }
    }

    function flipCard(cardContainer, icon) {
        if (lockBoard) return;
        if (cardContainer.classList.contains('flipped') || cardContainer.classList.contains('matched')) return;

        cardContainer.classList.add('flipped');
        flippedCards.push({ cardContainer, icon });

        if (flippedCards.length === 2) {
            checkForMatch();
        }
    }

    function checkForMatch() {
        const [item1, item2] = flippedCards;
        const isMatch = item1.icon === item2.icon;

        if (isMatch) {
            item1.cardContainer.classList.add('matched');
            item2.cardContainer.classList.add('matched');
            flippedCards = [];
            triggerMassiveCelebration();
        } else {
            lockBoard = true;
            setTimeout(() => {
                item1.cardContainer.classList.remove('flipped');
                item2.cardContainer.classList.remove('flipped');
                flippedCards = [];
                lockBoard = false;
            }, 1200);
        }
    }

    function resetGame() {
        initGame();
    }

    initBackgroundVideos();
    initGame();
</script>

</body>
</html>
